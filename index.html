<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Gols Pro - Over/Under</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://jsdelivr.net"></script>
</head>

<body>
    <div class="container">
        <h2>⚽ Analisador de Gols (Over 1.5 / Under 3.5)</h2>
        <br>

        <!-- VALOR DA BANCA E ODDS -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div>
                    <label>💰 <b>Stake (R$):</b> </label>
                    <input type="number" id="valorApostaTotal" value="100" style="width: 80px;">
                </div>
                <div>
                    <label>📈 <b>Odd Mercado O1.5:</b> </label>
                    <input type="number" id="mercadoOver15" step="0.01" placeholder="1.35" style="width: 70px;">
                </div>
                <div>
                    <label>📈 <b>Odd Mercado U3.5:</b> </label>
                    <input type="number" id="mercadoUnder35" step="0.01" placeholder="1.45" style="width: 70px;">
                </div>
            </div>
        </div>

        <!-- DADOS DOS TIMES (ÚLTIMOS JOGOS) -->
        <div class="card" style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <h4>Time A (Casa) - Últimos 5</h4>
                <table style="width: 100%;">
                    <tr>
                        <th>GP</th>
                        <th>GS</th>
                    </tr>
                    <tr>
                        <td><input type="number" class="golsA"></td>
                        <td><input type="number" class="golsSofridosA"></td>
                    </tr>
                    <tr>
                        <td><input type="number" class="golsA"></td>
                        <td><input type="number" class="golsSofridosA"></td>
                    </tr>
                    <tr>
                        <td><input type="number" class="golsA"></td>
                        <td><input type="number" class="golsSofridosA"></td>
                    </tr>
                    <tr>
                        <td><input type="number" class="golsA"></td>
                        <td><input type="number" class="golsSofridosA"></td>
                    </tr>
                    <tr>
                        <td><input type="number" class="golsA"></td>
                        <td><input type="number" class="golsSofridosA"></td>
                    </tr>
                </table>
            </div>

            <div style="flex: 1;">
                <h4>Time B (Fora) - Últimos 5</h4>
                <table style="width: 100%;">
                    <tr>
                        <th>GP</th>
                        <th>GS</th>
                    </tr>
                    <tr>
                        <td><input type="number" class="golsB"></td>
                        <td><input type="number" class="golsSofridosB"></td>
                    </tr>
                    <tr>
                        <td><input type="number" class="golsB"></td>
                        <td><input type="number" class="golsSofridosB"></td>
                    </tr>
                    <tr>
                        <td><input type="number" class="golsB"></td>
                        <td><input type="number" class="golsSofridosB"></td>
                    </tr>
                    <tr>
                        <td><input type="number" class="golsB"></td>
                        <td><input type="number" class="golsSofridosB"></td>
                    </tr>
                    <tr>
                        <td><input type="number" class="golsB"></td>
                        <td><input type="number" class="golsSofridosB"></td>
                    </tr>
                </table>
            </div>
        </div>

        <!-- CONFRONTO DIRETO (H2H) -->
        <div class="card">
            <h4>⚔️ Confronto Direto (H2H) - Últimos 5 Jogos</h4>
            <table style="width: 100%; text-align: center;">
                <thead>
                    <tr>
                        <th>Jogo</th>
                        <th>Gols Time A</th>
                        <th>Gols Time B</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td><input type="number" class="h2hA"></td>
                        <td><input type="number" class="h2hB"></td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td><input type="number" class="h2hA"></td>
                        <td><input type="number" class="h2hB"></td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td><input type="number" class="h2hA"></td>
                        <td><input type="number" class="h2hB"></td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td><input type="number" class="h2hA"></td>
                        <td><input type="number" class="h2hB"></td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td><input type="number" class="h2hA"></td>
                        <td><input type="number" class="h2hB"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="card" style="text-align: center;">
            <button onclick="calcular()"
                style="background: #2e7d32; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">GERAR
                ANÁLISE DE GOLS</button>
        </div>

        <div id="resultado" class="card"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
